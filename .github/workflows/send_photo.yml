name: Send Photo to Telegram

on:
  schedule:
  - cron: '15 23 * * *'
  - cron: '30 23 * * *'
  - cron: '45 23 * * *'
  - cron: '15 0 * * *'
  - cron: '30 0 * * *'
  - cron: '45 0 * * *'
  - cron: '15 1 * * *'
  - cron: '30 1 * * *'
  - cron: '45 1 * * *'
  - cron: '15 2 * * *'
  - cron: '30 2 * * *'
  - cron: '45 2 * * *'
  - cron: '15 3 * * *'
  - cron: '30 3 * * *'
  - cron: '45 3 * * *'
  - cron: '15 4 * * *'
  - cron: '30 4 * * *'
  - cron: '45 4 * * *'
  - cron: '15 5 * * *'
  - cron: '30 5 * * *'
  - cron: '45 5 * * *'
  - cron: '15 6 * * *'
  - cron: '30 6 * * *'
  - cron: '45 6 * * *'
  - cron: '15 7 * * *'
  - cron: '30 7 * * *'
  - cron: '45 7 * * *'
  - cron: '15 8 * * *'
  - cron: '30 8 * * *'
  - cron: '45 8 * * *'
  - cron: '15 9 * * *'
  - cron: '30 9 * * *'
  - cron: '45 9 * * *'
  - cron: '15 10 * * *'
  - cron: '30 10 * * *'
  - cron: '45 10 * * *'
  - cron: '15 11 * * *'
  - cron: '30 11 * * *'
  - cron: '45 11 * * *'
  - cron: '15 12 * * *'
  - cron: '30 12 * * *'
  - cron: '45 12 * * *'
  workflow_dispatch:

jobs:
  send_photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install requests
        run: pip install requests
      - name: Run script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_photo.py

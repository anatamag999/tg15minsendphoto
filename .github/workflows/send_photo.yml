name: Send Photo to Telegram

on:
  schedule:
    - cron: '*/15 23 * * *'
    - cron: '*/15 0 * * *'
    - cron: '*/15 1 * * *'
    - cron: '*/15 2 * * *'
    - cron: '*/15 3 * * *'
    - cron: '*/15 4 * * *'
    - cron: '*/15 5 * * *'
    - cron: '*/15 6 * * *'
    - cron: '*/15 7 * * *'
    - cron: '*/15 8 * * *'
    - cron: '*/15 9 * * *'
    - cron: '*/15 10 * * *'
    - cron: '*/15 11 * * *'
    - cron: '*/15 12 * * *'
  workflow_dispatch:

jobs:
  send_photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install requests
        run: pip install requests
      - name: Run script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_photo.py
